<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <title>अर्हम जीव दया भारत - सहयोग</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px 16px;
        background: #f4f6f8;
        margin: 0;
      }
      .card {
        background: #ffffff;
        max-width: 420px;
        margin: auto;
        padding: 28px 20px;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }
      h2 {
        color: #d9534f;
        margin-bottom: 8px;
      }
      .tagline {
        font-size: 16px;
        color: #333;
        margin-bottom: 20px;
        line-height: 1.5;
      }
      .btn {
        display: block;
        color: #ffffff;
        text-decoration: none;
        padding: 15px;
        margin: 12px 0;
        border-radius: 10px;
        font-size: 17px;
        font-weight: bold;
      }
      .btn-fixed {
        background: #2e7d32;
      }
      .btn-wa {
        background: #25d366;
        font-size: 15px;
        padding: 13px;
        margin-top: 18px;
      }
      .qr-box {
        margin: 20px auto 12px;
        padding: 12px;
        border: 1px dashed #ccc;
        border-radius: 12px;
        display: inline-block;
        background: #fafafa;
      }
      .qr-box img {
        width: 200px;
        height: 200px;
        display: block;
        margin: 0 auto;
      }
      .qr-label {
        font-size: 12px;
        color: #666;
        margin-top: 6px;
      }
      .upi-box {
        background: #f1f3f5;
        padding: 10px 14px;
        border-radius: 8px;
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .upi-text {
        font-family: monospace;
        font-size: 14px;
        color: #222;
        font-weight: bold;
      }
      .copy-btn {
        background: #343a40;
        color: #fff;
        border: none;
        padding: 7px 12px;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        font-weight: bold;
      }
      .info {
        font-size: 13px;
        color: #444;
        margin-top: 16px;
        line-height: 1.6;
        border-top: 1px solid #eee;
        padding-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>🙏 अर्हम जीव दया भारत 🙏</h2>
      <p class="tagline">
        एक दीपक ज्ञान का, उज्ज्वल भविष्य हर बच्चे का<br /><b
          >मात्र ₹500/- प्रतिमाह</b
        >
        में एक बच्चे को शिक्षा का सहयोग दें।
      </p>

      <a
        class="btn btn-fixed"
        href="upi://pay?pa=arhamjeevdaya@yesbankltd&pn=Arham%20Jeev%20Daya%20Bharat&am=500&cu=INR"
      >
        ₹500/- सहयोग करें (Fixed)
      </a>

      <div class="qr-box">
        <img src="qr-500.png" alt="₹500 UPI QR Code" />
        <div class="qr-label">₹500 के सहयोग हेतु किसी भी UPI ऐप से स्कैन करें</div>
      </div>

      <div class="upi-box">
        <span class="upi-text" id="upiId">arhamjeevdaya@yesbankltd</span>
        <button class="copy-btn" onclick="copyUPI()">Copy UPI</button>
      </div>

      <div class="info">✅ <b>80G में कर छूट उपलब्ध</b></div>

      <a
        class="btn btn-wa"
        href="https://wa.me/919717857614?text=%E0%A4%A8%E0%A4%AE%E0%A4%B8%E0%A5%8D%E0%A4%A4%E0%A5%87%2C%20%E0%A4%AE%E0%A5%88%E0%A4%82%E0%A4%A8%E0%A5%87%20%E0%A4%B6%E0%A4%BF%E0%A4%95%E0%A5%8D%E0%A4%B7%E0%A4%BE%20%E0%A4%B8%E0%A4%B9%E0%A4%AF%E0%A5%8B%E0%A4%97%20%E0%A4%B9%E0%A5%87%E0%A4%A4%E0%A5%81%20%E0%A4%A6%E0%A4%BE%E0%A4%A8%20%E0%A4%95%E0%A4%BF%E0%A4%AF%E0%A4%BE%20%E0%A4%B9%E0%A5%88%E0%A5%A4%20%E0%A4%95%E0%A5%83%E0%A4%AA%E0%A4%AF%E0%A4%BE%2080G%20%E0%A4%B0%E0%A4%B8%E0%A5%80%E0%A4%A6%20%E0%A4%AD%E0%A5%87%E0%A4%9C%E0%A5%87%E0%A4%82%E0%A5%A4"
      >
        📲 80G रसीद के लिए WhatsApp करें
      </a>
    </div>

    <script>
      function copyUPI() {
        navigator.clipboard.writeText("arhamjeevdaya@yesbankltd");
        const btn = document.querySelector(".copy-btn");
        btn.innerText = "Copied! ✓";
        btn.style.background = "#2e7d32";
        setTimeout(() => {
          btn.innerText = "Copy UPI";
          btn.style.background = "#343a40";
        }, 2000);
      }
    </script>
  </body>
</html>
